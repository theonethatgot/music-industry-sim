name: Music career playtest bridge

on:
  push:
    branches:
      - chatgpt/danielle-playtest
    paths:
      - 'gameplay/danielle/turns/*.json'
      - 'bridge/run_campaign.py'
      - 'bridge/requirements-lock.txt'
      - '.github/workflows/music-playtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-danielle-playtest
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bridge/requirements-lock.txt
      - name: Install pinned engine dependencies
        run: python -m pip install -r bridge/requirements-lock.txt
      - name: Restore verified checkpoint candidate
        uses: actions/cache@v4
        with:
          path: .bridge_cache
          key: danielle-v2-${{ hashFiles('musicsim/**/*.py', 'data/**/*.yaml', 'bridge/requirements-lock.txt') }}-${{ hashFiles('gameplay/danielle/turns/*.json') }}
          restore-keys: |
            danielle-v2-${{ hashFiles('musicsim/**/*.py', 'data/**/*.yaml', 'bridge/requirements-lock.txt') }}-
      - name: Resume or rebuild, validate, and produce narrator packet
        run: python -m bridge.run_campaign
      - name: Publish the latest narrator packet and run report
        run: |
          git add gameplay/danielle/output
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "gameplay: update Danielle's engine packet [skip ci]"
            git push
          fi
