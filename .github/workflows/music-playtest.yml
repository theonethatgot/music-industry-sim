name: Music career playtest bridge

on:
  push:
    branches:
      - chatgpt/danielle-playtest
    paths:
      - 'gameplay/danielle/turns/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-danielle-playtest
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild and verify Danielle's campaign
        run: python -m bridge.run_campaign
      - name: Publish the latest narrator packet and run report
        run: |
          git add gameplay/danielle/output\n          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gameplay/danielle/output
            git commit -m "gameplay: update Danielle's engine packet [skip ci]"
            git push
          fi
